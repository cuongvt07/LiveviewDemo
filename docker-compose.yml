services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '8005:8000'
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/mockup_service
      - ASSET_BASE_DIR=/app/templates
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-in-production}
      - RENDER_DEVICE=${RENDER_DEVICE:-cpu}
    volumes:
      - ./templates:/app/templates
      - ./inputs:/app/inputs
      - ./output:/app/output
    # GPU (Linux only): uncomment below to pass Intel UHD to container
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mockup_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
